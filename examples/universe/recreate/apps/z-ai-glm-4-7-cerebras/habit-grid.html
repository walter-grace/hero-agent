<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Habit Grid</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      background: #0f1311;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 20px;
    }
    .card {
      background: #171d1a;
      border-radius: 16px;
      padding: 32px;
      max-width: 900px;
    }
    h1 {
      color: #fff;
      font-size: 28px;
      font-weight: 600;
      margin-bottom: 6px;
    }
    h1 span {
      color: #6fdd92;
    }
    .subtitle {
      color: #6b7b6f;
      font-size: 14px;
      margin-bottom: 24px;
    }
    .stats {
      display: flex;
      gap: 48px;
      margin-bottom: 28px;
    }
    .stat {
      display: flex;
      flex-direction: column;
    }
    .stat-value {
      color: #fff;
      font-size: 32px;
      font-weight: 600;
      line-height: 1;
    }
    .stat-label {
      color: #5a6560;
      font-size: 10px;
      letter-spacing: 0.5px;
      margin-top: 4px;
    }
    .grid-container {
      display: grid;
      grid-template-columns: 24px 1fr;
      gap: 8px;
      margin-bottom: 20px;
    }
    .weekdays {
      display: grid;
      grid-template-rows: repeat(7, 12px);
      gap: 3px;
      align-content: start;
    }
    .weekday-label {
      height: 12px;
      display: flex;
      align-items: center;
      font-size: 9px;
      color: #5a6560;
    }
    .main-grid {
      display: grid;
      grid-auto-flow: column;
      grid-template-rows: repeat(7, 12px);
      gap: 3px;
    }
    .months {
      grid-column: 2;
      display: grid;
      grid-template-columns: repeat(53, 15px);
      gap: 3px;
      margin-bottom: 8px;
    }
    .month-label {
      font-size: 10px;
      color: #5a6560;
    }
    .cell {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      background: #1f2723;
      cursor: pointer;
      transition: transform 0.15s ease, outline 0.15s ease;
    }
    .cell:hover {
      transform: scale(1.35);
      outline: 1px solid #6fdd92;
      outline-offset: 1px;
      z-index: 1;
    }
    .cell.today {
      outline: 1px solid #6fdd92;
      outline-offset: 1px;
    }
    .cell.marked {
      background: #4ba569;
    }
    .cell.marked:hover {
      background: #5bc07b;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 16px;
      border-top: 1px solid #242c28;
    }
    .legend {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .legend-label {
      color: #5a6560;
      font-size: 11px;
    }
    .legend-swatch {
      width: 12px;
      height: 12px;
      border-radius: 3px;
    }
    .legend-swatch:nth-child(2) { background: #1f2723; }
    .legend-swatch:nth-child(3) { background: #2d4235; }
    .legend-swatch:nth-child(4) { background: #3a614a; }
    .legend-swatch:nth-child(5) { background: #4a815f; }
    .legend-swatch:nth-child(6) { background: #6fdd92; }
    .reset-btn {
      background: transparent;
      border: 1px solid #3a4540;
      color: #6b7b6f;
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .reset-btn:hover {
      border-color: #6fdd92;
      color: #6fdd92;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Habit <span>Grid</span></h1>
    <p class="subtitle">Click a day every time you keep the habit. The year fills in.</p>
    
    <div class="stats">
      <div class="stat">
        <span class="stat-value" id="daysKept">0</span>
        <span class="stat-label">DAYS KEPT</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="currentStreak">0</span>
        <span class="stat-label">CURRENT STREAK</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="bestStreak">0</span>
        <span class="stat-label">BEST STREAK</span>
      </div>
    </div>
    
    <div class="months" id="months"></div>
    
    <div class="grid-container">
      <div class="weekdays">
        <div class="weekday-label" style="grid-row: 1"></div>
        <div class="weekday-label" style="grid-row: 2"></div>
        <div class="weekday-label" style="grid-row: 3">Mon</div>
        <div class="weekday-label" style="grid-row: 4"></div>
        <div class="weekday-label" style="grid-row: 5">Wed</div>
        <div class="weekday-label" style="grid-row: 6"></div>
        <div class="weekday-label" style="grid-row: 7">Fri</div>
      </div>
      <div class="main-grid" id="grid"></div>
    </div>
    
    <div class="footer">
      <div class="legend">
        <span class="legend-label">Less</span>
        <div class="legend-swatch"></div>
        <div class="legend-swatch"></div>
        <div class="legend-swatch"></div>
        <div class="legend-swatch"></div>
        <div class="legend-swatch"></div>
        <span class="legend-label">More</span>
      </div>
      <button class="reset-btn" id="resetBtn">Reset Year</button>
    </div>
  </div>

  <script>
    const STORAGE_KEY = 'habit-grid-v1';
    const markedDates = new Set();
    
    // Get current year and generate all days
    const now = new Date();
    const currentYear = now.getFullYear();
    const jan1 = new Date(currentYear, 0, 1);
    const nextJan1 = new Date(currentYear + 1, 0, 1);
    const todayStr = now.toISOString().split('T')[0];
    
    // Calculate days in year (handles leap years)
    const daysInYear = Math.round((nextJan1 - jan1) / (1000 * 60 * 60 * 24));
    
    // Get weekday of Jan 1 (0 = Sunday, 6 = Saturday)
    const jan1Weekday = jan1.getDay();
    
    // Load from localStorage
    function load() {
      const saved = localStorage.getItem(STORAGE_KEY);
      if (saved) {
        try {
          const arr = JSON.parse(saved);
          arr.forEach(d => markedDates.add(d));
        } catch (e) {}
      }
    }
    
    // Save to localStorage
    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify([...markedDates]));
    }
    
    // Format date as YYYY-MM-DD
    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }
    
    // Generate cell element
    function createCell(dateStr, isInvisible = false) {
      const cell = document.createElement('div');
      cell.className = 'cell';
      cell.dataset.date = dateStr;
      
      if (isInvisible) {
        cell.style.visibility = 'hidden';
        cell.style.pointerEvents = 'none';
      } else {
        cell.title = dateStr;
        if (dateStr === todayStr) {
          cell.classList.add('today');
        }
        if (markedDates.has(dateStr)) {
          cell.classList.add('marked');
        }
        cell.addEventListener('click', () => toggleDate(dateStr, cell));
      }
      
      return cell;
    }
    
    // Toggle a date
    function toggleDate(dateStr, cell) {
      if (markedDates.has(dateStr)) {
        markedDates.delete(dateStr);
        cell.classList.remove('marked');
      } else {
        markedDates.add(dateStr);
        cell.classList.add('marked');
      }
      save();
      updateStats();
    }
    
    // Calculate streaks
    function calculateStreaks() {
      let currentStreak = 0;
      let bestStreak = 0;
      let tempStreak = 0;
      
      // Walk through all days up to today (not including)
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      
      // Find yesterday for current streak calculation
      const yesterday = new Date(today);
      yesterday.setDate(yesterday.getDate() - 1);
      
      // Count days kept
      const daysKept = markedDates.size;
      
      // Calculate current streak: count backward from yesterday (not today)
      let checkDate = new Date(yesterday);
      while (true) {
        const dateStr = formatDate(checkDate);
        if (markedDates.has(dateStr)) {
          currentStreak++;
          checkDate.setDate(checkDate.getDate() - 1);
        } else {
          break;
        }
      }
      
      // Calculate best streak across entire year
      checkDate = new Date(jan1);
      tempStreak = 0;
      
      for (let i = 0; i < daysInYear; i++) {
        const dateStr = formatDate(checkDate);
        if (markedDates.has(dateStr)) {
          tempStreak++;
          if (tempStreak > bestStreak) {
            bestStreak = tempStreak;
          }
        } else {
          tempStreak = 0;
        }
        checkDate.setDate(checkDate.getDate() + 1);
      }
      
      return { daysKept, currentStreak, bestStreak };
    }
    
    // Update stats display
    function updateStats() {
      const stats = calculateStreaks();
      document.getElementById('daysKept').textContent = stats.daysKept;
      document.getElementById('currentStreak').textContent = stats.currentStreak;
      document.getElementById('bestStreak').textContent = stats.bestStreak;
    }
    
    // Render month labels
    function renderMonths() {
      const monthsContainer = document.getElementById('months');
      const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
      
      months.forEach((month, idx) => {
        const firstOfMonth = new Date(currentYear, idx, 1);
        const weekday = firstOfMonth.getDay(); // 0 = Sunday
        const label = document.createElement('span');
        label.className = 'month-label';
        label.textContent = month;
        label.style.gridColumnStart = weekday + 1;
        monthsContainer.appendChild(label);
      });
    }
    
    // Render grid
    function renderGrid() {
      const grid = document.getElementById('grid');
      
      // Pad start with invisible cells
      for (let i = 0; i < jan1Weekday; i++) {
        grid.appendChild(createCell('', true));
      }
      
      // Add actual day cells
      for (let i = 0; i < daysInYear; i++) {
        const date = new Date(jan1);
        date.setDate(date.getDate() + i);
        const dateStr = formatDate(date);
        grid.appendChild(createCell(dateStr));
      }
    }
    
    // Reset handler
    document.getElementById('resetBtn').addEventListener('click', () => {
      if (confirm('Are you sure you want to reset the entire year? This cannot be undone.')) {
        markedDates.clear();
        save();
        document.querySelectorAll('.cell.marked').forEach(cell => {
          cell.classList.remove('marked');
        });
        updateStats();
      }
    });
    
    // Initialize
    load();
    renderMonths();
    renderGrid();
    updateStats();
  </script>
</body>
</html>
