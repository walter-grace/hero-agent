<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Habit Grid</title>
<style>
  :root { --bg:#0f1311; --card:#171d1a; --ink:#d9e2dc; --dim:#7b8a82; --e0:#1f2723; --e1:#2e5240; --e2:#3d7a58; --e3:#4fa970; --e4:#6fdd92; --accent:#6fdd92; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--ink); font:15px/1.5 ui-sans-serif,system-ui,sans-serif; min-height:100vh; display:grid; place-items:center; padding:24px; }
  .card { background:var(--card); border:1px solid #232b27; border-radius:16px; padding:28px; max-width:900px; width:100%; }
  h1 { font-size:22px; letter-spacing:-.02em; }
  h1 span { color:var(--accent); }
  .sub { color:var(--dim); font-size:13px; margin-top:2px; }
  .stats { display:flex; gap:24px; margin:18px 0 14px; }
  .stat b { font-size:22px; display:block; }
  .stat i { font-style:normal; color:var(--dim); font-size:12px; text-transform:uppercase; letter-spacing:.08em; }
  .months { display:grid; grid-template-columns:repeat(12,1fr); font-size:10px; color:var(--dim); margin:0 0 4px 26px; }
  .wrap { display:flex; gap:6px; }
  .dows { display:grid; grid-template-rows:repeat(7,12px); gap:3px; font-size:9px; color:var(--dim); }
  .dows span { height:12px; line-height:12px; }
  .grid { display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,12px); gap:3px; }
  .cell { width:12px; height:12px; border-radius:3px; background:var(--e0); cursor:pointer; transition:transform .06s; }
  .cell:hover { transform:scale(1.35); outline:1px solid var(--accent); }
  .cell.on { background:var(--e3); }
  .cell.today { outline:1px solid var(--accent); }
  .foot { display:flex; justify-content:space-between; align-items:center; margin-top:16px; font-size:12px; color:var(--dim); }
  .legend { display:flex; gap:3px; align-items:center; }
  .legend .cell { cursor:default; }
  button { background:none; border:1px solid #2c352f; color:var(--dim); border-radius:8px; padding:5px 10px; font-size:12px; cursor:pointer; }
  button:hover { color:var(--ink); border-color:var(--accent); }
</style>
</head>
<body>
<div class="card">
  <h1>Habit <span>Grid</span></h1>
  <div class="sub">Click a day every time you keep the habit. The year fills in.</div>
  <div class="stats">
    <div class="stat"><b id="total">0</b><i>days kept</i></div>
    <div class="stat"><b id="streak">0</b><i>current streak</i></div>
    <div class="stat"><b id="best">0</b><i>best streak</i></div>
  </div>
  <div class="months" id="months"></div>
  <div class="wrap">
    <div class="dows"><span></span><span>Mon</span><span></span><span>Wed</span><span></span><span>Fri</span><span></span></div>
    <div class="grid" id="grid"></div>
  </div>
  <div class="foot">
    <div class="legend">less <span class="cell"></span><span class="cell" style="background:var(--e1)"></span><span class="cell" style="background:var(--e2)"></span><span class="cell" style="background:var(--e3)"></span><span class="cell" style="background:var(--e4)"></span> more</div>
    <button id="reset">reset year</button>
  </div>
</div>
<script>
  const KEY = "habit-grid-v1";
  const year = new Date().getFullYear();
  const start = new Date(year, 0, 1);
  const days = Math.round((new Date(year + 1, 0, 1) - start) / 864e5);
  const iso = (d) => d.toISOString().slice(0, 10);
  const todayIso = iso(new Date());
  let marks = new Set(JSON.parse(localStorage.getItem(KEY) || "[]"));

  const grid = document.getElementById("grid");
  // pad so the first column starts on Sunday, GitHub-style
  const pad = start.getDay();
  for (let i = 0; i < pad; i++) { const s = document.createElement("span"); s.style.visibility = "hidden"; s.className = "cell"; grid.appendChild(s); }
  const cells = {};
  for (let i = 0; i < days; i++) {
    const d = new Date(year, 0, 1 + i);
    const k = iso(d);
    const c = document.createElement("span");
    c.className = "cell" + (marks.has(k) ? " on" : "") + (k === todayIso ? " today" : "");
    c.title = k;
    c.onclick = () => { marks.has(k) ? marks.delete(k) : marks.add(k); save(); render(); };
    cells[k] = c;
    grid.appendChild(c);
  }
  document.getElementById("months").innerHTML = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"].map((m) => `<span>${m}</span>`).join("");

  function streaks() {
    let cur = 0, best = 0, run = 0;
    for (let i = 0; i < days; i++) {
      const k = iso(new Date(year, 0, 1 + i));
      if (k > todayIso) break;
      if (marks.has(k)) { run++; best = Math.max(best, run); } else run = 0;
      if (k === todayIso) cur = run;
    }
    // if today unmarked, current streak = run through yesterday
    if (!marks.has(todayIso)) { cur = 0; let i = 1; while (marks.has(iso(new Date(Date.now() - i * 864e5)))) { cur++; i++; } }
    return { cur, best };
  }
  function render() {
    for (const [k, c] of Object.entries(cells)) c.classList.toggle("on", marks.has(k));
    document.getElementById("total").textContent = marks.size;
    const s = streaks();
    document.getElementById("streak").textContent = s.cur;
    document.getElementById("best").textContent = s.best;
  }
  function save() { localStorage.setItem(KEY, JSON.stringify([...marks])); }
  document.getElementById("reset").onclick = () => { if (confirm("Clear the whole year?")) { marks = new Set(); save(); render(); } };
  render();
</script>
</body>
</html>
